name: NH Login Check

# 診斷用：真瀏覽器登入一次（過 CF + 點 Cap 驗證碼），再用新鮮 cookie 打一次面板
# （dump 餘額 regex / csrf / CF 標頭 / gen_callback 首步），打印結果就收工。
# 唔會跑 AFK 迴圈、唔會發 TG。手動 workflow_dispatch 觸發。

on:
  workflow_dispatch:
    inputs:
      use_proxy:
        description: '先用 NODE_LINK 起住宅/機房代理，再經代理登入'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps + Chromium
        run: |
          pip install --quiet curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Setup proxy (optional)
        if: ${{ inputs.use_proxy }}
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: bash ./setup_proxy.sh

      - name: Login check
        env:
          EMAIL: ${{ secrets.NH_EMAIL }}
          PASSWORD: ${{ secrets.NH_PASSWORD }}
          BROWSER_WORK_DIR: ${{ github.workspace }}/browser-work
          NH_HEADLESS: '1'
          NH_CAP_WAIT: '60'
          PROXY: ${{ env.PROXY_SERVER }}
        run: |
          mkdir -p "$BROWSER_WORK_DIR"
          xvfb-run -a python - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          import neoheberg as nh

          bot = nh.NeohebergLoginBot()
          print(f"[check] email={'set' if bot.email else 'MISSING'} "
                f"headless={bot.headless} proxy={bot.proxy_url or '(直連)'}")
          cookies = bot.run()
          print(f"[check] 取得 cookie 數: {len(cookies)}")
          print(f"[check] cookie 名: {sorted(cookies)[:20]}")
          if not cookies:
              print("❌ 登入失敗")
              sys.exit(1)
          print("✅ 登入成功——Cap 驗證碼關卡已通過")

          # ── 餘額/面板診斷（2026-10-06 新增） ─────────────────────────
          # 背景：當日 AFK run 37432496406 用新鮮 cookie 驗餘額 5 連敗
          # （200 但頁面冇「X coins」），主循環 5h48m 零日誌收場。
          # 呢段模擬主循環同一條 curl_cffi Session 路徑，逐項 dump：
          #   ① HTTP 狀態/最終 URL/CF 標頭/頁 title（邊種回應？）
          #   ② 三條餘額 regex 實測（markup 改咗？）
          #   ③ csrf regex（主循環第一步要靠佢）
          #   ④ gen_callback 首步結果（"WAIT" = 主循環零日誌空轉嘅直接證據）
          import re
          state = {"saved_cookies": cookies}
          s = nh.make_session(state)
          r = s.get(nh.ADS_URL, timeout=20)
          print(f"[probe] GET {nh.ADS_URL} -> {r.status_code} final={r.url} bytes={len(r.text)}")
          print(f"[probe] cf-ray={r.headers.get('cf-ray')} server={r.headers.get('server')} "
                f"cf-mitigated={r.headers.get('cf-mitigated')} content-type={r.headers.get('content-type')}")
          tm = re.search(r"<title>(.*?)</title>", r.text, re.I | re.S)
          print(f"[probe] title={tm.group(1).strip()[:100] if tm else None}")
          clean = re.sub(r"<[^>]+>", " ", r.text)
          for pat in (r"Solde\s*[\d,\.]+\s*coins", r"Balance\s*[\d,\.]+\s*coins", r"[\d,\.]+\s*coins"):
              mm = re.search(pat, clean, re.I)
              print(f"[probe] regex {pat!r} -> {mm.group(0)!r}" if mm else f"[probe] regex {pat!r} -> MISS")
          cm = re.search(r"name=[\"'](csrf_token|_token)[\"']\s+value=[\"']([a-fA-F0-9]+)[\"']", r.text)
          print(f"[probe] csrf -> {cm.group(1) if cm else 'NOT FOUND'}")
          print(f"[probe] login跳轉={'/login' in r.url} Connexion字樣={'Connexion' in r.text[:600]}")
          vis = re.sub(r"\s+", " ", clean).strip()
          print(f"[probe] 可見文字前400: {vis[:400]}")
          sm = re.search(r"solde", vis, re.I)
          if sm:
              i = sm.start()
              print(f"[probe] 'solde' 前後: …{vis[max(0,i-60):i+120]}…")
          print(f"[probe] UA={str(s.headers.get('User-Agent'))[:75]}")
          print(f"[probe] PROXY={os.environ.get('PROXY') or '(direct)'}")
          print(f"[probe] cookie已載: {sorted(cookies)}")
          if cm:
              try:
                  cb = nh.gen_callback(s, cm.group(1), cm.group(2))
                  print(f"[probe] gen_callback 首步 -> {cb!r}"
                        + ("   ← 主循環會 sleep(20) 靜默空轉，零日誌" if cb == "WAIT" else ""))
              except Exception as e:
                  print(f"[probe] gen_callback 拋錯 -> {type(e).__name__}: {e}  ← 主循環會 sleep(30) 靜默")
          else:
              print("[probe] 無 csrf，跳過 gen_callback（主循環每輪會喺度靜默 except）")

          # ── CGU 關卡解剖（只讀，絕不提交同意） ─────────────────────
          print("[probe] ============ CGU 頁全面 dump ============")
          for fm in re.finditer(r"<form[^>]*?action=[\"']([^\"']*)[\"'][^>]*?>(.*?)</form>", r.text, re.I | re.S):
              head = fm.group(0)[:fm.group(0).find(">") + 1]
              print(f"[probe] FORM head: {head[:220]}")
              for tag in re.finditer(r"<(?:input|button|textarea|select|label)[^>]*>.*?(?:</label>)?", fm.group(2), re.I | re.S):
                  t = re.sub(r"\s+", " ", tag.group(0)).strip()
                  if t: print(f"[probe]   tag: {t[:240]}")
              ftxt = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", fm.group(2))).strip()
              print(f"[probe]   form文字: {ftxt[:700]}")
          vis_full = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r.text)).strip()
          print(f"[probe] CGU 頁可見全文: {vis_full[:1600]}")
          # 主循環真身：POST /shop/ads 原始回應（cb=None 嘅來源）
          if cm:
              r2 = s.post(nh.ADS_URL, data={cm.group(1): cm.group(2)},
                          allow_redirects=False, timeout=20)
              print(f"[probe] POST /shop/ads -> {r2.status_code} "
                    f"Location={r2.headers.get('Location')!r} len={len(r2.text)}")
          # 驗證：直接請求 CGU 頁本身
          r3 = s.get(f"{nh.BASE}/account/cgu", timeout=20)
          print(f"[probe] GET /account/cgu -> {r3.status_code} final={r3.url} bytes={len(r3.text)}")

          # ── 真瀏覽器渲染 CGU 頁（只讀：不點任何嘢，只 dump 可見內容+可互動元素） ──
          try:
              from playwright.sync_api import sync_playwright
              with sync_playwright() as pw:
                  lk = {}
                  if os.environ.get("PROXY"):
                      lk["proxy"] = {"server": os.environ["PROXY"]}
                  browser = pw.chromium.launch(**lk)
                  ctx = browser.new_context(
                      user_agent=nh.UA_CHROME,
                      viewport={"width": 1366, "height": 900},
                      locale="fr-FR", timezone_id="Europe/Paris")
                  ctx.add_cookies([
                      {"name": k, "value": v, "url": nh.BASE + "/"}
                      for k, v in cookies.items()
                  ])
                  pg = ctx.new_page()
                  pg.goto(f"{nh.BASE}/account/cgu", wait_until="domcontentloaded", timeout=45000)
                  pg.wait_for_timeout(5000)
                  print(f"[cgu] url={pg.url}")
                  print(f"[cgu] title={pg.title()}")
                  txt = " ".join(pg.inner_text("body").split())
                  print(f"[cgu] innerText({len(txt)}字): {txt[:1800]}")
                  els = pg.eval_on_selector_all(
                      "button, a, input[type=submit], input[type=checkbox], [role=button]",
                      """els => els.map(e => ({tag: e.tagName, type: e.type || '',
                          txt: (e.innerText || e.value || e.getAttribute('aria-label') || '').trim().slice(0,90),
                          id: e.id || '', cls: (e.className || '').toString().slice(0,70),
                          href: e.getAttribute && e.getAttribute('href') || ''}))""")
                  for e in els:
                      print(f"[cgu] 元素: {e}")

                  # ── 第四段（2026-10-06 用戶授權方案 A）：接受 Privacy Policy 2026-10-05 版 ──
                  # 只會喺「待接受文案 + J'accepte 按鈕」同時存在時先點；已接受就只報狀態唔點。
                  btn = pg.locator("button[type=submit]")
                  has_pending = ("j'accepte" in txt.lower() and "déjà accepté" not in txt.lower())
                  print(f"[accept] 待接受={has_pending} submit掣數={btn.count()}")
                  if has_pending and btn.count() > 0:
                      print(f"[accept] 撳掣前: {txt[:260]}")
                      btn.first.click()
                      pg.wait_for_timeout(7000)
                      txt2 = " ".join(pg.inner_text("body").split())
                      print(f"[accept] 撳掣後 url={pg.url} innerText={txt2[:320]}")
                  else:
                      print(f"[accept] 冇觸發點擊（已接受／冇掣）: {txt[:260]}")

                  # 落新 cookie（接受動作可能輪換 session）
                  fresh2 = {c["name"]: c["value"] for c in ctx.cookies()}
                  print(f"[accept] cookie 變動: {'有' if fresh2 != cookies else '無'}"
                        f"（{len(fresh2)} 個）")

                  # 驗證 1（瀏覽器）：直開 /shop/ads 應再唔會被弹去 /account/cgu
                  pg.goto(nh.ADS_URL, wait_until="domcontentloaded", timeout=45000)
                  pg.wait_for_timeout(5000)
                  ptxt = " ".join(pg.inner_text("body").split())
                  bm = re.search(r"(?:Solde|Balance)\s*[\d,\.]+\s*coins", ptxt, re.I)
                  print(f"[accept] 驗證1 瀏览器 GET /shop/ads -> url={pg.url}")
                  print(f"[accept] 驗證1 餘額字樣 -> {bm.group(0)!r}" if bm
                        else f"[accept] 驗證1 餘額字樣 MISS｜頁頭240: {ptxt[:240]}")
                  browser.close()
          except Exception as e:
              print(f"[cgu] 瀏覽器 dump 失敗: {type(e).__name__}: {e}")
              fresh2 = locals().get("fresh2", cookies)

          try:
              # 驗證 2（curl_cffi Session——主循環真身）：/shop/ads 直達 + 餘額 regex
              state2 = {"saved_cookies": fresh2}
              s2 = nh.make_session(state2)
              r4 = s2.get(nh.ADS_URL, timeout=20)
              print(f"[accept] 驗證2 Session GET -> {r4.status_code} final={r4.url}")
              c2 = re.sub(r"<[^>]+>", " ", r4.text)
              bm2 = re.search(r"(?:Solde|Balance)\s*[\d,\.]+\s*coins", c2, re.I) or \
                    re.search(r"[\d,\.]+\s*coins", c2, re.I)
              print(f"[accept] 驗證2 餘額 -> {bm2.group(0)!r}" if bm2
                    else "[accept] 驗證2 餘額 MISS")
              # 驗證 3：gen_callback 應回真實 callback URL（唔再係 None/WAIT）
              cm2 = re.search(r"name=[\"'](csrf_token|_token)[\"']\s+value=[\"']([a-fA-F0-9]+)[\"']", r4.text)
              if cm2:
                  cb2 = nh.gen_callback(s2, cm2.group(1), cm2.group(2))
                  print(f"[accept] 驗證3 gen_callback -> {cb2!r}"
                        + ("   ← 仲係 None/WAIT，主循環會繼續靜默" if not cb2 or cb2 == "WAIT" else "   ← 主循環返生"))
              else:
                  print("[accept] 驗證3 csrf 未搵到")
          except Exception as e:
              print(f"[accept] 驗證2/3 異常: {type(e).__name__}: {e}")
          PY




