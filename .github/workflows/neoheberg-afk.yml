name: NeoHeberg AFK

on:
  schedule:
    - cron: '30 1 * * *'   # 北京時間 09:30
  workflow_dispatch:

concurrency:
  group: neoheberg-afk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 每輪 ~72s × 100 輪 ≈ 2h，留足緩衝
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth >/dev/null

      - name: Cache Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Cache AFK state (cookies)
        uses: actions/cache@v4
        with:
          path: ./browser-work
          key: neoheberg-state-${{ github.run_id }}
          restore-keys: |
            neoheberg-state-

      - name: Install python deps + Chromium
        run: |
          pip install --quiet curl_cffi playwright
          python -m playwright install --with-deps chromium

      # 登入已經唔靠代理（真瀏覽器機房 IP 都過 CF + Cap），代理純粹係加分項：
      # 節點死咗唔應該拖冧成個 run，所以 continue-on-error（失敗只會令 PROXY_SERVER 冇值 → 直連）。
      - name: Setup residential proxy (sing-box via NODE_LINK)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: bash ./setup_proxy.sh

      - name: Run AFK
        env:
          EMAIL: ${{ secrets.NH_EMAIL }}
          PASSWORD: ${{ secrets.NH_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOTIFY_NAME: NeoHeberg-GHA
          BROWSER_WORK_DIR: ${{ github.workspace }}/browser-work
          NH_WAIT: '65'
          NH_HEADLESS: '1'
          NH_CAP_WAIT: '60'
          PROXY: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail   # 貼住 python 嘅 exit code，唔好俾 tee 食咗
          mkdir -p "$BROWSER_WORK_DIR"
          xvfb-run -a -s "-screen 0 1280x800x24" python neoheberg.py 2>&1 | tee afk.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afk-log
          path: |
            afk.log
            *.png
          if-no-files-found: warn
          retention-days: 3
