name: NeoHeberg AFK

on:
  schedule:
    - cron: '30 1 * * *'   # 北京時間 09:30
  workflow_dispatch:

concurrency:
  group: neoheberg-afk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 每輪 ~72s × 100 輪 ≈ 2h，留足緩衝
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 libdbus-glib-1-2 >/dev/null

      - name: Cache Firefox runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruyipage
          key: ruyipage-firefox-v1

      - name: Cache AFK state (cookies)
        uses: actions/cache@v4
        with:
          path: ./browser-work
          key: neoheberg-state-${{ github.run_id }}
          restore-keys: |
            neoheberg-state-

      - name: Install python deps + Firefox runtime
        run: |
          pip install --quiet curl_cffi ruyipage
          python -m ruyipage install

      - name: Setup residential proxy (sing-box via NODE_LINK)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: bash ./setup_proxy.sh

      - name: Run AFK
        env:
          EMAIL: ${{ secrets.NH_EMAIL }}
          PASSWORD: ${{ secrets.NH_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOTIFY_NAME: NeoHeberg-GHA
          BROWSER_WORK_DIR: ${{ github.workspace }}/browser-work
          NH_WAIT: '65'
          PROXY: ${{ env.PROXY_SERVER }}
        run: |
          mkdir -p "$BROWSER_WORK_DIR"
          xvfb-run -a -s "-screen 0 1280x800x24" python neoheberg.py 2>&1 | tee afk.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afk-log
          path: afk.log
          retention-days: 3
